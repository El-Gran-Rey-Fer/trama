mitologia-griega:
  slug: gr

  # `pregunta`/`pregunta_inversa` solo se declaran en las relaciones que alguien autoría a
  # mano (o que grafo.ts sintetiza como si lo fueran): son las que tarjetas.ts recorre para
  # generar la baraja de práctica. Las inversas puras (hijo_de, habita, porta, escenario_de,
  # tiene_participante) no llevan plantilla propia porque nunca son el lado "origen" de una
  # arista original.
  #
  # `conjunto`/`conjunto_inversa` marcan qué dirección es de respuesta única (una tarjeta por
  # arista, ej. "¿quién es el padre de Zeus?" -> un solo nombre) y cuál es de respuesta en
  # conjunto (todas las aristas origen+tipo agrupadas en una sola tarjeta con todos los destinos,
  # ej. "¿de quién es padre Crono?" -> los cuatro hijos en una tarjeta, no cuatro tarjetas).
  # Por defecto, sin la marca, es de respuesta única.
  relaciones:
    padre_de:
      inversa: hijo_de
      pregunta: "¿De quién es padre {origen}?"
      pregunta_inversa: "¿Quién es el padre de {destino}?"
      conjunto: true # un padre puede tener varios hijos
    madre_de:
      inversa: hijo_de
      pregunta: "¿De quién es madre {origen}?"
      pregunta_inversa: "¿Quién es la madre de {destino}?"
      conjunto: true # una madre puede tener varios hijos
    hijo_de:
      inversa: padre_de # documentado por completitud; ninguna de las 10 entidades lo autoría directamente en Hito 1
    hermano_de:
      inversa: hermano_de
      simetrica: true
      pregunta: "¿Quién es hermano de {origen}?"
      pregunta_inversa: "¿Quién es hermano de {destino}?"
      conjunto: true # se puede tener varios hermanos
      conjunto_inversa: true
    consorte_de:
      inversa: consorte_de
      simetrica: true
      pregunta: "¿Quién es consorte de {origen}?"
      pregunta_inversa: "¿Quién es consorte de {destino}?"
      conjunto: true # la mitología no es monógama
      conjunto_inversa: true
    habitado_por:
      inversa: habita
      pregunta: "¿Quién habita en {origen}?"
      pregunta_inversa: "¿Dónde habita {destino}?"
      conjunto: true # un lugar puede tener varios habitantes (el Monte Olimpo ya tiene dos)
    habita:
      inversa: habitado_por
    portado_por:
      inversa: porta
      pregunta: "¿Quién porta {origen}?"
      pregunta_inversa: "¿Qué porta {destino}?"
      conjunto_inversa: true # alguien puede portar varios objetos
    porta:
      inversa: portado_por
    ocurre_en:
      inversa: escenario_de
      pregunta: "¿Dónde ocurre {origen}?"
      pregunta_inversa: "¿Qué relato ocurre en {destino}?"
      conjunto_inversa: true # un lugar puede ser escenario de varios relatos
    escenario_de:
      inversa: ocurre_en # documentado por completitud; grafo.ts la sintetiza desde el campo `lugar` del relato, nadie la autoría a mano
    participa_en:
      inversa: tiene_participante
      pregunta: "¿En qué relato participa {origen}?"
      pregunta_inversa: "¿Quién participa en {destino}?"
      conjunto: true # alguien puede participar en varios relatos
      conjunto_inversa: true # un relato tiene muchos participantes (ver Titanomaquia: 14)
    tiene_participante:
      inversa: participa_en # documentado por completitud; grafo.ts la sintetiza desde `participantes`, nadie la autoría a mano
    devora_a:
      inversa: devorado_por
      pregunta: "¿A quién devora {origen}?"
      pregunta_inversa: "¿Quién devora a {destino}?"
      conjunto: true # crono devora a cinco de sus hijos
    devorado_por:
      inversa: devora_a
    encierra_a:
      inversa: encerrado_por
      pregunta: "¿A quién encierra {origen}?"
      pregunta_inversa: "¿Quién encierra a {destino}?"
      conjunto: true # urano encierra a titanes, ciclopes y hecatonquiros
    encerrado_por:
      inversa: encierra_a
    rapta_a:
      inversa: raptado_por
      pregunta: "¿A quién rapta {origen}?"
      pregunta_inversa: "¿Quién rapta a {destino}?"
    raptado_por:
      inversa: rapta_a
    castiga_a:
      inversa: castigado_por
      pregunta: "¿A quién castiga {origen}?"
      pregunta_inversa: "¿Quién castiga a {destino}?"
      conjunto: true # un dios puede castigar a varios mortales
    castigado_por:
      inversa: castiga_a
    mata_a:
      inversa: matado_por
      pregunta: "¿A quién mata {origen}?"
      pregunta_inversa: "¿Quién mata a {destino}?"
      conjunto: true # un mismo origen puede matar a varias víctimas a lo largo del corpus
    matado_por:
      inversa: mata_a
    mutila_a:
      inversa: mutilado_por
      pregunta: "¿A quién mutila {origen}?"
      pregunta_inversa: "¿Quién mutila a {destino}?"
    mutilado_por:
      inversa: mutila_a
    forja:
      inversa: forjado_por
      pregunta: "¿Qué forja {origen}?"
      pregunta_inversa: "¿Quién forja {destino}?"
      conjunto: true # quien forja puede forjar varios objetos
    forjado_por:
      inversa: forja
    construye:
      inversa: construido_por
      pregunta: "¿Qué construye {origen}?"
      pregunta_inversa: "¿Quién construye {destino}?"
      conjunto: true # quien construye puede construir varias cosas
    construido_por:
      inversa: construye

  fuentes:
    teogonia: { autor: "Hesíodo", obra: "Teogonía" }
    trabajos-y-dias: { autor: "Hesíodo", obra: "Trabajos y días", siglo: -8 }
    iliada: { autor: "Homero", obra: "Ilíada" }
    biblioteca: { autor: "Apolodoro", obra: "Biblioteca" }
    metamorfosis: { autor: "Ovidio", obra: "Metamorfosis" }
    vida-de-teseo: { autor: "Plutarco", obra: "Vida de Teseo" }
    olimpicas: { autor: "Píndaro", obra: "Olímpicas" }
    himno-homerico-atenea: { obra: "Himno homérico a Atenea" }
    himno-homerico-demeter: { obra: "Himno homérico a Deméter" }

  # tipos de entidad en uso. Registro descriptivo, sin validación de build todavía (eso es Bloque A).
  # sin género: los distractores de opción múltiple y <Coleccion filtro={{tipo:"titan"}} /> salen
  # de entidades del mismo `tipo` exacto, y un tipo generizado parte el conjunto en dos. El género
  # es un problema de presentación (etiquetas, ej. "olimpico"), no del campo `tipo`.
  # "estirpe" es para colectivos (titanes, ciclopes, hecatonquiros): la convención de ids en
  # singular admite excepción para estas entidades colectivas, cuyo id natural es el plural.
  tipos:
    - primordial
    - dios
    - titan
    - estirpe
    - lugar
    - objeto
    - mito
    - heroe # teseo-y-el-minotauro: teseo
    - mortal # teseo-y-el-minotauro: minos, pasífae, dédalo, androgeo, egeo, ariadna
    - monstruo # teseo-y-el-minotauro: toro de creta, minotauro

  # etiquetas en uso. Registro descriptivo, sin validación de build todavía (igual que tipos).
  # los `ciclo-*` son un eje geográfico/dinástico ortogonal a `eras`: un mito tiene una era y
  # puede tener un ciclo. ciclo-tebano/argivo/troyano se declaran vacíos a propósito, para fijar
  # la convención antes de que alguien invente una etiqueta suelta para un ciclo mítico futuro.
  etiquetas:
    - sucesion-divina # castracion-de-urano, titanomaquia
    - profecia # nacimiento-de-atenea
    - rapto # rapto-de-persefone
    - mito-etiologico # rapto-de-persefone
    - castigo-divino # teseo-y-el-minotauro
    - zeus-amores # nacimiento-de-atenea
    - guerra # titanomaquia; eje real con miembros futuros (gigantomaquia, guerra de troya)
    - ciclo-cretense # teseo-y-el-minotauro
    - ciclo-tebano # vacía a propósito
    - ciclo-argivo # vacía a propósito
    - ciclo-troyano # vacía a propósito

  # el orden es la posición en la lista, no un campo propio: así es imposible declarar una
  # era fuera de secuencia. El criterio de corte es el reinado (cosmogonia llega hasta el
  # final del de Urano, edad-de-los-titanes es el de Crono, etc.); `orden` en un relato es
  # local a su era, no global.
  eras:
    - id: cosmogonia
      nombre: Cosmogonía
    - id: edad-de-los-titanes
      nombre: Edad de los Titanes
    - id: edad-de-los-olimpicos
      nombre: Edad de los Olímpicos
    - id: edad-de-los-heroes
      nombre: Edad de los héroes
    - id: guerra-de-troya
      nombre: La guerra de Troya y los regresos

  # Paso 6 del modo aventura: una plantilla por atributo, y una para epítetos
  # (pregunta inversa: dado el epíteto, qué entidad es). {origen} es la entidad
  # cuyo campo se pregunta; {epiteto} es el epíteto concreto de la tarjeta.
  plantillas_tarjeta:
    atributos:
      simbolo: "¿Cuál es el símbolo de {origen}?"
      dominio: "¿Sobre qué domina {origen}?"
      equivalente_romano: "¿Cuál es el nombre romano de {origen}?"
    epiteto: "¿Qué dios es «{epiteto}»?"

  # Paso 2 del modo aventura (docs/plan-modo-aventura.md). `nombre` es provisional en los
  # cinco: la prioridad ahora es validar la estructura, no el rótulo — se revisan cuando entre
  # el resto del temario (héroes, dioses, todo lo que falta). El conjunto de tarjetas de un
  # capítulo es `participantes de sus relatos ∪ entidades_extra`; no se lista a mano lo que el
  # grafo puede derivar. `orden` en múltiplos de 100 dentro de la era, igual que en relatos.
  capitulos:
    - id: el-primer-linaje
      nombre: El primer linaje # provisional
      era: cosmogonia
      orden: 100
      resumen: De dónde sale todo y por qué el primer rey del cosmos dura tan poco.
      relatos: [castracion-de-urano]
      examen: { aciertos: 8, de: 10 }
    - id: la-guerra-por-el-cosmos
      nombre: La guerra por el cosmos # provisional
      era: edad-de-los-titanes
      orden: 100
      resumen: Diez años de guerra entre titanes y olímpicos deciden quién gobierna el mundo.
      relatos: [titanomaquia]
      entidades_extra: [tartaro, monte-otris] # centrales en la prosa, fuera de `participantes`
      examen: { aciertos: 8, de: 10 }
    - id: la-astucia-de-zeus
      nombre: La astucia de Zeus # provisional
      era: edad-de-los-olimpicos
      orden: 100
      resumen: Zeus se traga a su primera esposa para evitar una profecía, y de su cabeza nace una diosa armada.
      relatos: [nacimiento-de-atenea]
      examen: { aciertos: 8, de: 10 }
    - id: las-estaciones
      nombre: Las estaciones # provisional
      era: edad-de-los-olimpicos
      orden: 200
      resumen: Un rapto en el inframundo explica por qué la tierra deja de dar fruto una parte del año.
      relatos: [rapto-de-persefone]
      examen: { aciertos: 8, de: 10 }
    - id: el-laberinto
      nombre: El laberinto # provisional
      era: edad-de-los-heroes
      orden: 100
      resumen: Atenas paga un tributo de sangre a Creta hasta que un héroe se interna en el laberinto.
      relatos: [teseo-y-el-minotauro]
      examen: { aciertos: 8, de: 10 }
    # guerra-de-troya: sin capítulos todavía, cero relatos escritos

  # --- huecos reservados para hitos futuros (schema-legales, sin uso funcional) ---
  # atributos:
  #   fuerza: { pregunta: "..." }
  # idiomas:
  #   disponibles: [es]
  #   porDefecto: es
  # enlaces:
  #   - tipo: wikipedia
  #     url: "https://..."
  # timeline: relativo
  # mapa:
  #   mapeable: true
  # rutas: {}
