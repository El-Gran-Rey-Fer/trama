# tipos de entidad en uso. Registro descriptivo, sin validación de build todavía (fuera del
# alcance de A5: no está en su lista de comprobaciones).
# sin género: los distractores de opción múltiple y <Coleccion filtro={{tipo:"titan"}} /> salen
# de entidades del mismo `tipo` exacto, y un tipo generizado parte el conjunto en dos. El género
# es un problema de presentación (etiquetas, ej. "olimpico"), no del campo `tipo`.
# "estirpe" es para colectivos (titanes, ciclopes, hecatonquiros): la convención de ids en
# singular admite excepción para estas entidades colectivas, cuyo id natural es el plural.
tipos:
  - primordial
  - dios
  - titan
  - estirpe
  - lugar
  - objeto
  - ninfa
  - mito
  - heroe # teseo-y-el-minotauro: teseo
  - mortal # teseo-y-el-minotauro: minos, pasífae, dédalo, androgeo, egeo, ariadna
  - monstruo # teseo-y-el-minotauro: toro de creta, minotauro
  - obra # plan de imágenes y álbum §3.1: cuadro, vasija, estatua o ilustración

# Contrato multi-materia (bloque V, plan de gamificación §10). No se consumen
# todavía: tipos_coleccionables es de las medallas de personaje (bloque Y) y
# etiqueta_eje_temporal es de la interfaz (Design).
tipos_coleccionables: [ primordial, titan, dios, heroe, monstruo ]
etiqueta_eje_temporal: Eras

# Color por tipo de entidad (fondo de la casilla sin retrato). Antes vivía
# fijo en src/styles/tokens.css como --color-tipo-<tipo>; Base.astro lo
# inyecta ahora por materia. Sin entrada para un tipo (aquí, "ninfa"),
# Casilla.astro cae a --color-tarjeta-borde — mismo comportamiento que ya
# tenía cualquier tipo sin variable definida.
colores_tipo:
  primordial: oklch(45% 0.03 270)
  dios: oklch(55% 0.16 250)
  titan: oklch(50% 0.14 300)
  estirpe: oklch(52% 0.12 200)
  lugar: oklch(58% 0.09 160)
  objeto: oklch(62% 0.12 80)
  mito: oklch(52% 0.15 340)
  heroe: oklch(55% 0.17 45)
  mortal: oklch(55% 0.02 90)
  monstruo: oklch(40% 0.1 140)
  obra: oklch(55% 0.01 90)

# etiquetas en uso. A partir de A5 (plan de imágenes y álbum) es de validación de build: una
# etiqueta fuera de esta lista rompe el build (scripts/validar-contenido.mjs).
# los `ciclo-*` son un eje geográfico/dinástico ortogonal a `eras`: un mito tiene una era y
# puede tener un ciclo. ciclo-tebano/argivo/troyano se declaran vacíos a propósito, para fijar
# la convención antes de que alguien invente una etiqueta suelta para un ciclo mítico futuro.
# `olimpico`, `atributo` y `arma` son ejes ortogonales a `tipo` (no todo `tipo: dios` es
# olímpico, no todo `tipo: objeto` es un atributo icónico o un arma).
etiquetas:
  - olimpico # zeus, hera, poseidon, hades, atenea, afrodita, hermes, hefesto, dioniso, persefone
  - atributo # rayo, aguila
  - arma # rayo
  - sucesion-divina # castracion-de-urano, titanomaquia
  - profecia # nacimiento-de-atenea
  - rapto # rapto-de-persefone
  - ctonico
  - mito-etiologico # rapto-de-persefone
  - castigo-divino # teseo-y-el-minotauro
  - zeus-amores # nacimiento-de-atenea
  - guerra # titanomaquia; eje real con miembros futuros (gigantomaquia, guerra de troya)
  - ciclo-cretense # teseo-y-el-minotauro
  - ciclo-tebano # vacía a propósito
  - ciclo-argivo # vacía a propósito
  - ciclo-troyano # vacía a propósito

# el orden es la posición en la lista, no un campo propio: así es imposible declarar una
# era fuera de secuencia. El criterio de corte es el reinado (cosmogonia llega hasta el
# final del de Urano, edad-de-los-titanes es el de Crono, etc.); `orden` en un relato es
# local a su era, no global.
eras:
  - id: cosmogonia
    nombre: Cosmogonía
  - id: edad-de-los-titanes
    nombre: Edad de los Titanes
  - id: edad-de-los-olimpicos
    nombre: Edad de los Olímpicos
  - id: edad-de-los-heroes
    nombre: Edad de los héroes
  - id: guerra-de-troya
    nombre: La guerra de Troya y los regresos

# Paso 6 del modo aventura: una plantilla por atributo, y una para epítetos
# (pregunta inversa: dado el epíteto, qué entidad es). {origen} es la entidad
# cuyo campo se pregunta; {epiteto} es el epíteto concreto de la tarjeta.
plantillas_tarjeta:
  atributos:
    simbolo: "¿Cuál es el símbolo de {origen}?"
    dominio: "¿Sobre qué domina {origen}?"
    equivalente_romano: "¿Cuál es el nombre romano de {origen}?"
  epiteto: "¿Qué dios es «{epiteto}»?"

# Plan de imágenes y álbum §3.5, paso A4. Nombres provisionales, del dominio
# (no "nivel 1/2/3"): a revisar cuando el álbum lleve contenido de verdad.
# `umbral` es la fracción de (cromos dominados + capítulos cerrados) sobre
# el total; ordenado de menor a mayor.
niveles:
  - id: aprendiz
    nombre: Aprendiz de los mitos
    umbral: 0
  - id: aspirante-a-heroe
    nombre: Aspirante a héroe
    umbral: 0.25
  - id: estudiante-de-quiron
    nombre: Estudiante de Quirón
    umbral: 0.5
  - id: heroe-consagrado
    nombre: Héroe consagrado
    umbral: 0.75
  - id: par-de-los-doce
    nombre: Par de los Doce
    umbral: 1.0

# Paso 2 del modo aventura (docs/plan-modo-aventura.md). `nombre` es provisional en los
# cinco: la prioridad ahora es validar la estructura, no el rótulo — se revisan cuando entre
# el resto del temario (héroes, dioses, todo lo que falta). El conjunto de tarjetas de un
# capítulo es `participantes de sus relatos ∪ entidades_extra`; no se lista a mano lo que el
# grafo puede derivar. `orden` en múltiplos de 100 dentro de la era, igual que en relatos.
# docs/mapa-de-contenido.md entero, no solo lo escrito: `relatos` es la lista
# prevista, no una promesa de que ya existan. cargarCapitulos (src/lib/capitulos.ts)
# calcula cuántos de esos ids ya están en la colección `relatos` y de ahí sale
# `activo` — un capítulo pasa de "Próximamente" a real solo con que aparezca el
# primer relato de su lista, sin tocar este fichero. `orden` es la posición real
# dentro del mapa (§2-§6), no el orden de escritura, para que la numeración
# era.posición no se recoloque cuando un capítulo se activa.
capitulos:
  # ─── cosmogonía ────────────────────────────────────────────────
  - id: del-caos-al-primer-rey
    nombre: Del Caos al primer rey
    era: cosmogonia
    orden: 100
    resumen: De dónde sale todo y por qué el primer rey del cosmos dura tan poco.
    relatos: [ nacimiento-del-cosmos, castracion-de-urano ]
    examen: { aciertos: 8, de: 10 }
    medalla: primeras-generaciones

  # ─── edad de los titanes ───────────────────────────────────────
  - id: el-rey-que-devora
    nombre: El rey que devora
    era: edad-de-los-titanes
    orden: 100
    resumen: Crono hereda el trono con una profecía encima y hace lo único que se le
      ocurre.
    relatos: [ crono-devora-a-sus-hijos ]
    examen: { aciertos: 8, de: 10 }

  - id: la-creacion-de-los-mortales
    nombre: La creación de los mortales
    era: edad-de-los-titanes
    orden: 200
    resumen: La primera estirpe de mortales vive bajo Crono sin trabajo ni vejez, y
      Prometeo la modela de barro en una tradición que no coincide con la
      primera en el cuándo.
    relatos: [ la-raza-de-oro, prometeo-modela-a-los-hombres ]
    entidades_extra: [ japeto ]
    examen: { aciertos: 8, de: 10 }

  - id: la-guerra-por-el-cosmos
    nombre: La guerra por el cosmos
    era: edad-de-los-titanes
    orden: 300
    resumen: Diez años de guerra entre titanes y olímpicos deciden quién gobierna el
      mundo.
    relatos: [ titanomaquia ]
    entidades_extra: [ monte-otris ]
    examen: { aciertos: 8, de: 10 }

  # ─── edad de los olímpicos ─────────────────────────────────────
  - id: el-reparto-del-cosmos
    nombre: El reparto del cosmos
    era: edad-de-los-olimpicos
    orden: 100
