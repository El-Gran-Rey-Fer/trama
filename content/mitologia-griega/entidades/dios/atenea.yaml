id: atenea
tipo: dios
nombre: Atenea
etiquetas: [olimpico]
resumen: >
  Diosa que nace ya adulta y armada, saliendo de la cabeza de Zeus después
  de que este devorase a su madre Metis embarazada.
epitetos: [De ojos glaucos, La de la égida]
atributos:
  simbolo: la lechuza y la égida
  dominio: la sabiduría, la estrategia y los oficios
  culto: Atenas, el Partenón
  equivalente_romano: Minerva
relaciones:
  - tipo: habita
    destino: monte-olimpo
