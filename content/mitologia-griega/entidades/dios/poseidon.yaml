id: poseidon
tipo: dios
nombre: Poseidón
resumen: >
  Dios del mar, hermano de Zeus y Hades.
generacion: 3
etiquetas: [ olimpico ]
epitetos: [ El que sacude la tierra, Señor de los caballos ]
atributos:
  simbolo: el tridente
  dominio: el mar y los terremotos
  culto: los Juegos Ístmicos, cerca de Corinto
  equivalente_romano: Neptuno
relaciones:
  - tipo: castiga_a
    destino: minos
  - tipo: encierra_a
    destino: titanes
  - tipo: rapta_a
    destino: pelope
    fuente: olimpicas
  - tipo: conspira_contra
    destino: zeus
    fuente: iliada
