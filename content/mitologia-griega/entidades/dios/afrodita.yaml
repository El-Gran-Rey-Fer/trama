id: afrodita
tipo: dios
nombre: Afrodita
etiquetas: [olimpico]
resumen: >
  Diosa que nace de la espuma formada alrededor de los genitales cortados de
  Urano y llega a tierra en Chipre.
epitetos: [Urania, Cípride]
atributos:
  simbolo: la paloma
  dominio: el amor y la belleza
  culto: Chipre y Citera
  equivalente_romano: Venus
