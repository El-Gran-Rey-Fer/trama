id: hestia
tipo: dios
nombre: Hestia
genero: femenino
resumen: >
  Diosa del hogar y el fuego doméstico, la primogénita de Crono y Rea.
epitetos: [Guardiana del hogar]
atributos:
  simbolo: el fuego del hogar
  dominio: el hogar y la vida doméstica
  culto: cada hogar tenía su altar; sin grandes templos propios
  equivalente_romano: Vesta
relaciones:
  - tipo: habita
    destino: monte-olimpo
