id: hermes
tipo: dios
nombre: Hermes
resumen: >
  Dios mensajero que Zeus envía al inframundo a pedir a Hades que deje subir
  a Perséfone junto a su madre.
etiquetas: [olimpico]
epitetos: [Mensajero de los dioses]
atributos:
  simbolo: el caduceo y las sandalias aladas
  dominio: los caminos, los mensajeros y el comercio
  culto: hermai (pilares) en los cruces de caminos
  equivalente_romano: Mercurio
