id: hades
tipo: dios
nombre: Hades
resumen: >
  Dios del inframundo, hermano de Zeus y Poseidón.
generacion: 3
etiquetas: [olimpico]
epitetos: [El que acoge a muchos]
atributos:
  simbolo: el casco de invisibilidad
  dominio: el inframundo y los muertos
  culto: escaso; pocos templos dedicados
  equivalente_romano: Plutón
relaciones:
  - tipo: rapta_a
    destino: persefone
  - tipo: encierra_a
    destino: titanes
  - tipo: gobierna
    destino: inframundo
