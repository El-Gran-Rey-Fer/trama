id: dioniso
tipo: dios
nombre: Dioniso
resumen: >
  Dios que reclama para sí a Ariadna cuando Teseo la deja abandonada en la
  isla de Naxos.
etiquetas: [olimpico]
epitetos: [Dos veces nacido]
atributos:
  simbolo: el tirso y el racimo de uvas
  dominio: el vino, el éxtasis y el teatro
  culto: las Dionisíacas de Atenas
  equivalente_romano: Baco
