id: erinias
tipo: estirpe
nombre: Erinias
genero: femenino
resumen: >
  Diosas vengadoras nacidas de la sangre de Urano derramada sobre la tierra,
  que persiguen sin descanso a quien derrama la sangre de los suyos.
