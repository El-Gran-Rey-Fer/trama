id: elara
tipo: mortal
nombre: Elara
genero: femenino
resumen: Mujer amada por Zeus a la que él esconde bajo tierra por miedo a Hera,
  madre del gigante Ticio. Según la fuente es hija o nieta del rey Minias.
etiquetas: [ zeus-amores ]
relaciones:
  - tipo: madre_de
    destino: ticio
    fuente: biblioteca
  - tipo: hijo_de
    destino: minias
