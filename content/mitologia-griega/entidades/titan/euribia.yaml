id: euribia
nombre: Euribia
tipo: titan
genero: femenino
resumen: Hija de Ponto y Gea, consorte de Crío. De su unión nacen Astreo, Perses y Palas —
  la generación que enlaza con Eos, las estrellas y los vientos.
