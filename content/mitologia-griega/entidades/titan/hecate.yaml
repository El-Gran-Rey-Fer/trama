id: hecate
tipo: titan
nombre: Hécate
genero: femenino
resumen: >
  Diosa que habita en una cueva y es la única en escuchar el grito de
  Perséfone al ser raptada; ayuda después a Deméter a buscarla.
epitetos: [La de las encrucijadas]
atributos:
  simbolo: las antorchas
  dominio: la magia, la noche y las encrucijadas
  culto: ofrendas nocturnas en las encrucijadas
