<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Foco — Trama</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
  }
  header {
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    background: #1c1c1c;
    border-bottom: 1px solid #333;
  }
  #valor {
    font-size: 18px;
    font-weight: 700;
    font-family: ui-monospace, monospace;
  }
  #copiar {
    padding: 6px 12px;
    cursor: pointer;
  }
  #lienzo-wrap {
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  #lienzo {
    max-width: 100%;
    max-height: 80vh;
    cursor: crosshair;
    border: 1px solid #333;
  }
  #vacio {
    padding: 40px;
    text-align: center;
    color: #888;
  }
</style>
</head>
<body>
  <header>
    <input id="fichero" type="file" accept="image/*" />
    <span>o ruta:</span>
    <input id="ruta" type="text" placeholder="/public/img/gr/obras/jupiter-louvre-lens.jpg" size="40" />
    <button id="cargar-ruta" type="button">Cargar</button>
    <span id="valor">clica la imagen para marcar el foco</span>
    <button id="copiar" type="button" hidden>Copiar [x, y]</button>
  </header>
  <div id="lienzo-wrap">
    <p id="vacio">Elige una imagen, o escribe su ruta si sirves el repo con un servidor local, para marcar su foco como etiquetar una foto.</p>
    <canvas id="lienzo" hidden></canvas>
  </div>

  <script>
    const elFichero = document.getElementById("fichero");
    const elRuta = document.getElementById("ruta");
    const elCargarRuta = document.getElementById("cargar-ruta");
    const elLienzo = document.getElementById("lienzo");
    const elValor = document.getElementById("valor");
    const elCopiar = document.getElementById("copiar");
    const elVacio = document.getElementById("vacio");
    const ctx = elLienzo.getContext("2d");

    let ultimoValor = null;

    function pintar(img) {
      elLienzo.width = img.naturalWidth;
      elLienzo.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
      elLienzo.hidden = false;
      elVacio.hidden = true;
    }

    elFichero.addEventListener("change", () => {
      const archivo = elFichero.files?.[0];
      if (!archivo) return;
      const img = new Image();
      img.onload = () => {
        pintar(img);
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(archivo);
    });

    elCargarRuta.addEventListener("click", () => {
      const ruta = elRuta.value.trim();
      if (!ruta) return;
      const img = new Image();
      img.onload = () => pintar(img);
      img.onerror = () => {
        elValor.textContent = `no se pudo cargar "${ruta}"`;
      };
      img.src = ruta;
    });

    elLienzo.addEventListener("click", (evento) => {
      const rect = elLienzo.getBoundingClientRect();
      const xPorc = ((evento.clientX - rect.left) / rect.width) * 100;
      const yPorc = ((evento.clientY - rect.top) / rect.height) * 100;
      ultimoValor = `[${xPorc.toFixed(0)}, ${yPorc.toFixed(0)}]`;
      elValor.textContent = `foco: ${ultimoValor}`;
      elCopiar.hidden = false;
    });

    elCopiar.addEventListener("click", () => {
      if (ultimoValor) navigator.clipboard.writeText(ultimoValor);
    });
  </script>
</body>
</html>
